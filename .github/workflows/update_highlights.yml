name: Update Highlights Data
on:
  schedule:
    - cron: "45 8 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: highlights-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python update_highlights.py
      - name: Commit Highlights metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/highlights_metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Highlights market data"
            git pull --rebase
            git push
          fi
